<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>Lower Third Slide</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin=""
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <style>
            body {
                margin: 0;
            }
            #root {
                position: relative;
                width: 1920px;
                height: 1080px;
                overflow: hidden;
                background: transparent;
            }
            .clip {
                position: absolute;
                inset: 0;
            }
            #bar {
                position: absolute;
                bottom: 80px;
                left: 80px;
                height: 160px;
                display: flex;
                align-items: center;
                padding: 0 60px 0 44px;
                background: #ffffff;
                border-radius: 16px;
                box-shadow: 0 8px 48px rgba(0, 0, 0, 0.18);
                white-space: nowrap;
            }
            #logo {
                height: 100px;
                width: 100px;
                object-fit: contain;
                margin-right: 36px;
                transform-origin: center center;
            }
            #url {
                font-family: "Poppins", system-ui, "Segoe UI", sans-serif;
                font-weight: 700;
                font-size: 48px;
                color: #333333;
                letter-spacing: 0.4px;
            }
        </style>
    </head>
    <body>
        <div
            data-hf-id="hf-dok7"
            id="root"
            data-composition-id="lower-third-slide"
            data-start="0"
            data-width="1920"
            data-height="1080"
            data-duration="7"
        >
            <div
                data-hf-id="hf-4g0l"
                id="lower-third-clip"
                class="clip"
                data-start="0"
                data-duration="7"
                data-track-index="0"
            >
                <div
                    data-hf-id="hf-6x7j"
                    id="bar"
                    data-layout-allow-overflow=""
                >
                    <img data-hf-id="hf-erp9" id="logo" src="logo.png" alt="" />
                    <span data-hf-id="hf-mh00" id="url"
                        >https://github.com/darellanodev/pattern-lab-php</span
                    >
                </div>
            </div>
        </div>
        <script>
            window.__timelines = window.__timelines || {};
            const tl = gsap.timeline({ paused: true });

            tl.fromTo(
                "#bar",
                { x: -1600 },
                { x: 0, duration: 2, ease: "power2.out" },
                0,
            );

            tl.fromTo(
                "#logo",
                { rotation: -8 },
                {
                    rotation: 8,
                    duration: 0.625,
                    ease: "sine.inOut",
                    repeat: 7,
                    yoyo: true,
                    immediateRender: false,
                },
                1,
            );

            tl.to("#bar", { opacity: 0, duration: 1, ease: "power2.in" }, 6);

            window.__timelines["lower-third-slide"] = tl;
        </script>
    </body>
</html>
