<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>Panel Steps</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin=""
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <style>
            body {
                margin: 0;
            }
            #root {
                --font-mono:
                    "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
                position: relative;
                width: 1920px;
                height: 1080px;
                overflow: hidden;
                background: transparent;
            }
            .clip {
                position: absolute;
            }
            #card {
                position: absolute;
                bottom: 80px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 40px 60px 44px;
                background: #ffffff;
                border-radius: 16px;
                box-shadow: 0 12px 48px rgba(0, 0, 0, 0.16);
                font-family: "Poppins", system-ui, "Segoe UI", sans-serif;
                white-space: nowrap;
            }
            .steps-row {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 40px;
                margin-bottom: 44px;
            }
            .step {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            .circle {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                background: #ffffff;
                border: 0.5px solid #d0d0d0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #666666;
                font-weight: 700;
                font-size: 48px;
                transform-origin: center center;
                --glow-alpha: 0;
                box-shadow: 0 0 44px 12px rgba(29, 111, 216, var(--glow-alpha));
            }
            .label {
                font-size: 30px;
                font-weight: 600;
                color: #333333;
            }
            .connector {
                width: 150px;
                height: 2px;
                background: #d0d0d0;
            }
            #desc-1,
            #desc-2,
            #desc-3 {
                font-size: 32px;
                font-weight: 700;
                color: #000000;
                line-height: 1.6;
                text-align: center;
                margin: 0;
            }
            #desc-2,
            #desc-3 {
                display: none;
            }
            #desc-1 code,
            #desc-2 code,
            #desc-3 code {
                font-family: var(--font-mono);
                font-size: 28px;
                background: #f2f2f2;
                padding: 2px 8px;
                border-radius: 6px;
            }
        </style>
    </head>
    <body>
        <div
            data-hf-id="hf-p001"
            id="root"
            data-composition-id="panel-steps"
            data-start="0"
            data-width="1920"
            data-height="1080"
            data-duration="34.6"
        >
            <div
                data-hf-id="hf-p002"
                id="card"
                class="clip"
                data-start="0"
                data-duration="34.6"
                data-track-index="0"
            >
                <div data-hf-id="hf-p003" class="steps-row">
                    <div data-hf-id="hf-p004" class="step">
                        <div data-hf-id="hf-p005" id="circle-1" class="circle">
                            <span data-hf-id="hf-p006" id="num-1">1</span>
                        </div>
                        <div data-hf-id="hf-p007" id="label-1" class="label">
                            Paso 1
                        </div>
                    </div>
                    <div
                        data-hf-id="hf-p008"
                        id="connector-1"
                        class="connector"
                    ></div>
                    <div data-hf-id="hf-p009" class="step">
                        <div data-hf-id="hf-p010" id="circle-2" class="circle">
                            <span data-hf-id="hf-p011" id="num-2">2</span>
                        </div>
                        <div data-hf-id="hf-p012" id="label-2" class="label">
                            Paso 2
                        </div>
                    </div>
                    <div
                        data-hf-id="hf-p013"
                        id="connector-2"
                        class="connector"
                    ></div>
                    <div data-hf-id="hf-p014" class="step">
                        <div data-hf-id="hf-p015" id="circle-3" class="circle">
                            <span data-hf-id="hf-p016" id="num-3">3</span>
                        </div>
                        <div data-hf-id="hf-p017" id="label-3" class="label">
                            Paso 3
                        </div>
                    </div>
                </div>
                <p data-hf-id="hf-p018" id="desc-1">
                    Paso 1: Creamos la clase
                    <code data-hf-id="hf-92cz">Character</code> de nuestro
                    personaje (todavía sin el patrón
                    <code data-hf-id="hf-mky9">Fluent Interface</code>)
                </p>
                <p data-hf-id="hf-p019" id="desc-2">
                    Paso 2: Implementamos el código cliente y al final empezamos
                    a pensar en
                    <code data-hf-id="hf-zm6j">Fluent Interface Pattern</code>
                </p>
                <p data-hf-id="hf-p020" id="desc-3">
                    Paso 3: Modificamos la clase para usar
                    <code data-hf-id="hf-13e3">Fluent Interface Pattern</code>
                </p>
            </div>
        </div>
        <script>
            window.__timelines = window.__timelines || {};
            const tl = gsap.timeline({ paused: true });
            const BLOCK = 10.2;
            const GAP = 2;
            const BLOCKS = 3;
            for (let k = 0; k < BLOCKS; k++) {
                const num = k + 1;
                const s = k * (BLOCK + GAP);
                tl.set(
                    ["#desc-1", "#desc-2", "#desc-3"],
                    { autoAlpha: 0, display: "none" },
                    s,
                );
                tl.set(`#desc-${num}`, { autoAlpha: 1, display: "block" }, s);
                tl.set(
                    ["#circle-1", "#circle-2", "#circle-3"],
                    { backgroundColor: "#ffffff", "--glow-alpha": 0 },
                    s,
                );
                tl.set(["#num-1", "#num-2", "#num-3"], { color: "#666666" }, s);
                tl.set(
                    ["#label-1", "#label-2", "#label-3"],
                    { color: "#333333" },
                    s,
                );
                tl.set(`#circle-${num}`, { backgroundColor: "#1d6fd8" }, s);
                tl.set(`#num-${num}`, { color: "#ffffff" }, s);
                tl.set(`#label-${num}`, { color: "#1d6fd8" }, s);
                tl.fromTo(
                    "#card",
                    { opacity: 0 },
                    {
                        opacity: 1,
                        duration: 0.6,
                        ease: "power2.out",
                        immediateRender: k === 0,
                        overwrite: "auto",
                    },
                    s,
                );
                tl.fromTo(
                    `#circle-${num}`,
                    { scale: 1, "--glow-alpha": 0 },
                    {
                        scale: 1.12,
                        "--glow-alpha": 0.35,
                        duration: 0.5,
                        ease: "sine.inOut",
                        repeat: 17,
                        yoyo: true,
                        immediateRender: false,
                    },
                    s + 0.6,
                );
                tl.to(
                    "#card",
                    {
                        opacity: 0,
                        duration: 0.6,
                        ease: "power2.in",
                        overwrite: "auto",
                    },
                    s + 9.6,
                );
            }
            window.__timelines["panel-steps"] = tl;
        </script>
    </body>
</html>
