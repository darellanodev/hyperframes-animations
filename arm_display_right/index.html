<!DOCTYPE html>
<html lang="en" data-composition-variables='[{"id":"imageUrl","type":"string","label":"Image URL","default":"image.png"},{"id":"entryDuration","type":"number","label":"Entry Duration","default":2.5},{"id":"holdDuration","type":"number","label":"Hold Duration","default":5},{"id":"exitDuration","type":"number","label":"Exit Duration","default":2.5},{"id":"idleAmplitude","type":"number","label":"Idle Amplitude","default":0.02}]'>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    body {
      position: relative;
    }

    #three-layer {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <div data-hf-id="hf-ca4s" id="root" data-composition-id="arm_display_right" data-no-timeline="" data-start="0" data-duration="10" data-width="1920" data-height="1080">
    <canvas data-hf-id="hf-eogq" id="three-layer"></canvas>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
      }
    }
    </script>

  <script type="module">
    import * as THREE from "three";

    const root = document.getElementById("root");
    const html = document.documentElement;

    const varDecls = (() => {
      try { return JSON.parse(html.dataset.compositionVariables); }
      catch { return []; }
    })();
    const varDefaults = {};
    for (const d of varDecls) { varDefaults[d.id] = d.default; }

    const readVar = (key) => {
      const attr = key.replace(/([A-Z])/g, "-$1").toLowerCase();
      const fromDataset = root.dataset[attr];
      if (fromDataset !== undefined && fromDataset !== "") {
        const num = parseFloat(fromDataset);
        return isNaN(num) ? fromDataset : num;
      }
      return varDefaults[key];
    };

    const imageUrl = readVar("imageUrl");
    const entryD = readVar("entryDuration");
    const holdD = readVar("holdDuration");
    const exitD = readVar("exitDuration");
    const idleAmp = readVar("idleAmplitude");
    const totalD = entryD + holdD + exitD;

    root.dataset.duration = totalD;

    const canvas = document.getElementById("three-layer");
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(1920, 1080, false);
    renderer.setPixelRatio(1);
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const aspect = 1920 / 1080;
    const camera = new THREE.PerspectiveCamera(36, aspect, 0.1, 100);
    camera.position.set(3.2, 0.3, 9);
    camera.lookAt(0, 0, 0);

    const ambient = new THREE.AmbientLight(0x404060, 0.4);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(-3, 6, 4);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x8888ff, 0.4);
    fillLight.position.set(4, 1, 3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0x4488ff, 0.6);
    rimLight.position.set(0, -2, -5);
    scene.add(rimLight);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x334466, 0.5);
    scene.add(hemi);

    const armGroup = new THREE.Group();

    const matBody = new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.25, metalness: 0.15 });
    const matJoint = new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.15, metalness: 0.4, emissive: 0x2266aa, emissiveIntensity: 0.08 });
    const matDark = new THREE.MeshStandardMaterial({ color: 0x505050, roughness: 0.5, metalness: 0.3 });
    const matAccent = new THREE.MeshStandardMaterial({ color: 0x66aadd, roughness: 0.2, metalness: 0.5 });

    const baseRing = new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.12, 16, 32), matDark);
    baseRing.position.set(0, 2.8, 0);
    baseRing.rotation.x = Math.PI / 2;
    armGroup.add(baseRing);

    const basePlate = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 0.3, 24), matAccent);
    basePlate.position.set(0, 2.65, 0);
    armGroup.add(basePlate);

    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 0.5, 16), matDark);
    pillar.position.set(0, 2.25, 0);
    armGroup.add(pillar);

    const lowerArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2.0, 0.3), matBody);
    lowerArm.position.set(0, 1.0, 0);
    armGroup.add(lowerArm);

    const joint = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 20), matJoint);
    joint.position.set(0, 0.05, 0);
    armGroup.add(joint);

    const jointRing = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.04, 12, 20), matAccent);
    jointRing.position.set(0, 0.05, 0);
    jointRing.rotation.y = Math.PI / 4;
    armGroup.add(jointRing);

    const upperArm = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.5, 0.28), matBody);
    upperArm.position.set(0, -0.85, 0.4);
    upperArm.rotation.x = 0.35;
    armGroup.add(upperArm);

    const wrist = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), matJoint);
    wrist.position.set(0, -1.5, 0.7);
    armGroup.add(wrist);

    const mount = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.4, 8), matDark);
    mount.position.set(0, -1.6, 0.95);
    armGroup.add(mount);

    const panelGeom = new THREE.BoxGeometry(1.7, 1.7, 0.05);
    const panelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.05, metalness: 0.9 });
    const panel = new THREE.Mesh(panelGeom, panelMat);
    panel.position.set(0, -1.4, 1.15);
    armGroup.add(panel);

    const bezelGeom = new THREE.BoxGeometry(1.82, 1.82, 0.015);
    const bezelMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.15, metalness: 0.6, emissive: 0x224466, emissiveIntensity: 0.03 });
    const bezel = new THREE.Mesh(bezelGeom, bezelMat);
    bezel.position.set(0, -1.4, 1.10);
    armGroup.add(bezel);

    const createFallbackTexture = () => {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#e0e0e0";
      ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = "#c8c8c8";
      ctx.lineWidth = 1;
      for (let i = 0; i < 512; i += 32) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
      }
      for (let i = 0; i < 512; i += 32) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
      }
      ctx.strokeStyle = "#d4d4d4";
      ctx.lineWidth = 0.5;
      for (let i = -512; i < 512 + 512; i += 48) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 512, 512); ctx.stroke();
      }
      ctx.fillStyle = "#d0d0d0";
      ctx.beginPath(); ctx.arc(256, 256, 60, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#b0b0b0";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(256, 256, 40, 0, Math.PI * 1.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(256, 256); ctx.lineTo(310, 224); ctx.stroke();
      return new THREE.CanvasTexture(c);
    };

    const fallbackTex = createFallbackTexture();
    fallbackTex.colorSpace = THREE.SRGBColorSpace;
    fallbackTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

    if (imageUrl) {
      const loader = new THREE.TextureLoader();
      loader.load(imageUrl, (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        panel.material = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 1, roughness: 0.2, metalness: 0 });
      }, undefined, () => {
        panel.material = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: fallbackTex, emissiveIntensity: 1, roughness: 0.2, metalness: 0 });
        console.warn("Image load failed, using fallback texture");
      });
    } else {
      panel.material = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: fallbackTex, emissiveIntensity: 1, roughness: 0.2, metalness: 0 });
    }

    armGroup.position.x = 3.5;
    scene.add(armGroup);

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function easeInCubic(t) {
      return t * t * t;
    }

    function renderAt(time) {
      let phase, localT;

      if (time < entryD) {
        phase = "entry";
        localT = time / entryD;
      } else if (time < entryD + holdD) {
        phase = "hold";
        localT = (time - entryD) / holdD;
      } else {
        phase = "exit";
        localT = Math.min((time - entryD - holdD) / exitD, 1);
      }

      if (phase === "entry") {
        const t = easeOutCubic(localT);
        armGroup.position.y = 8 - 7 * t;
        armGroup.rotation.y = (-Math.PI / 2) * (1 - t);
        armGroup.rotation.z = 0;
      } else if (phase === "hold") {
        armGroup.position.y = 1.0;
        const idleY = Math.sin(localT * Math.PI * 2 * 0.4) * idleAmp;
        const idleZ = Math.sin(localT * Math.PI * 2 * 0.25) * idleAmp * 0.3;
        armGroup.rotation.y = idleY;
        armGroup.rotation.z = idleZ;
      } else {
        const t = easeInCubic(localT);
        armGroup.position.y = 1.0 + 7 * t;
        armGroup.rotation.y = (-Math.PI / 2) * t;
        armGroup.rotation.z = 0;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener("hf-seek", (event) => {
      renderAt(event.detail.time);
    });

    renderAt(window.__hfThreeTime || 0);
  </script>
</body>

</html>
